server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://127.0.0.1:3306/llm_api?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    pool-name: Retail_HikariCP
    minimum-idle: 15 #最小空闲连接数量
    idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
    maximum-pool-size: 25 #连接池最大连接数，默认是10
    auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
    max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
    connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
    connection-test-query: SELECT 1
  type: com.zaxxer.hikari.HikariDataSource

# MyBatis 配置（显式列出真实 mapper，脚手架模板 frame_case_mapper.xml 引用不存在的占位类，
# 通配扫描会解析失败，故不纳入；后续新增 mapper 在此追加）
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

# 安全审计与规则治理
security:
  audit:
    enabled: true
    mode: warn
    block-critical: false
    scan-request: true
    scan-response: false
    max-scan-bytes: 0
    scanners:
      credential: true
      path: true
      unicode: false
      network: false
      tool-risk: false
      tracking: false
  rules:
    seed-on-start: true
    cache-enabled: true

# 数据面调度与日志保留档
dispatch:
  # 总尝试次数 = retry-count + 1；缺省不设上限，沿用完整 failover 队列
  # retry-count: 3

request-log:
  # detailed=原样 / brief=请求 messages 最近 3 条 / basic=正文不落库
  policy: detailed

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml
