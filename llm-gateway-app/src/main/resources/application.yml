spring:
  config:
    name: lqx-ddd-app
  profiles:
    active: dev
  mvc:
    async:
      request-timeout: 600000

server:
  tomcat:
    threads:
      max: 200

security:
  audit:
    enabled: true
    mode: warn
    block-critical: false
    scanners:
      credential: true
      path: true
      unicode: false
      network: false
      tool-risk: false
      tracking: false
